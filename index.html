<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육환경 리스크 분석</title>

<!-- PapaParse (CSV) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<!-- SheetJS (XLSX) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root {
  --bg:        #0d1117;
  --panel:     #161b27;
  --panel2:    #1c2438;
  --border:    #2a3550;
  --accent:    #3b82f6;
  --red:       #f87171;
  --yellow:    #fbbf24;
  --text:      #cdd5e0;
  --muted:     #64748b;
  --success:   #34d399;
  --header-h:  52px;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* ── 헤더 ── */
#header {
  height: var(--header-h);
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 14px;
  flex-shrink: 0;
  z-index: 100;
}
#header .logo {
  font-size: 15px; font-weight: 800;
  color: #fff; letter-spacing: -.3px; white-space: nowrap;
}
#header .logo span { color: var(--accent); }

.hdr-sep { width:1px; height:24px; background:var(--border); flex-shrink:0; }

/* API 키 입력 */
.key-group {
  display: flex; align-items: center; gap: 6px;
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 10px; flex-shrink: 0;
}
.key-group label { font-size: 11px; color: var(--muted); white-space: nowrap; }
.key-group input {
  background: transparent; border: none; outline: none;
  color: var(--text); font-family: 'Consolas', monospace; font-size: 12px;
  width: 200px;
}
.key-group .eye-btn {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 13px; padding: 0 2px;
}
.key-group .eye-btn:hover { color: var(--text); }
#key-save-btn {
  background: var(--accent); color: #fff;
  border: none; border-radius: 6px;
  padding: 5px 12px; font-size: 12px; cursor: pointer;
  font-family: inherit; white-space: nowrap;
}
#key-save-btn:hover { background: #2563eb; }
#key-status {
  font-size: 11px; color: var(--muted); white-space: nowrap;
}
#key-status.ok { color: var(--success); }
#key-status.err { color: var(--red); }

.hdr-spacer { flex: 1; }

.hdr-link {
  font-size: 11px; color: var(--accent);
  text-decoration: none; white-space: nowrap;
}
.hdr-link:hover { text-decoration: underline; }

/* ── 메인 레이아웃 ── */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── 좌측 패널 ── */
#left {
  width: 400px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 주소 입력 섹션 */
#addr-section {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--panel2);
}
.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: .8px;
  color: var(--muted); text-transform: uppercase; margin-bottom: 8px;
}
.addr-row { display: flex; gap: 8px; }
#addr-input {
  flex: 1; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px;
  color: var(--text); font-family: inherit; font-size: 13px; outline: none;
}
#addr-input:focus { border-color: var(--accent); }
#analyze-btn {
  background: #1d4ed8; color: #fff; border: none;
  border-radius: 8px; padding: 8px 16px; font-size: 13px;
  font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap;
}
#analyze-btn:hover { background: #2563eb; }
#analyze-btn:disabled { background: #374151; color: var(--muted); cursor: not-allowed; }

/* DB 섹션 */
#db-section {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.db-btn {
  border: none; border-radius: 7px; padding: 6px 12px;
  font-size: 12px; cursor: pointer; font-family: inherit;
  white-space: nowrap; font-weight: 600; transition: background .15s;
}
#db-upload-btn { background: #065f46; color: #fff; }
#db-upload-btn:hover { background: #047857; }
#db-clear-btn  { background: #450a0a; color: #fca5a5; }
#db-clear-btn:hover  { background: #7f1d1d; }
#db-status-text {
  font-size: 11px; color: var(--muted);
  flex: 1; min-width: 0; line-height: 1.5;
}
#db-status-text.loaded   { color: var(--success); }
#db-status-text.restored { color: #7dd3fc; }
#db-status-text.error    { color: var(--red); }
#file-input { display: none; }

/* ── 저장 상태 표시줄 ── */
#save-bar {
  padding: 5px 16px; background: rgba(59,130,246,.07);
  border-bottom: 1px solid var(--border);
  font-size: 11px; color: var(--muted);
  display: flex; align-items: center; gap: 6px;
}
#save-bar .save-dot {
  width:6px; height:6px; border-radius:50%;
  background: var(--muted); flex-shrink:0; transition: background .3s;
}
#save-bar .save-dot.saved  { background: var(--success); box-shadow: 0 0 5px var(--success); }
#save-bar .save-dot.saving { background: var(--yellow); animation: pulse .8s infinite; }
#save-bar .save-dot.none   { background: var(--muted); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* 안내 링크 */
#guide-section {
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: #0f172a;
  font-size: 11px; color: var(--muted);
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
#guide-section a { color: var(--accent); text-decoration: none; }
#guide-section a:hover { text-decoration: underline; }

/* 리포트 */
#report-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
#report-header .r-title { font-size: 12px; font-weight: 700; color: var(--text); flex:1; }
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
.badge-red    { background:#3b1a1a; color:var(--red);    border:1px solid #7f1d1d; }
.badge-yellow { background:#3b2d0a; color:var(--yellow); border:1px solid #78350f; }
.badge-gray   { background:#1e293b; color:var(--muted);  border:1px solid var(--border); }

#report-list { flex:1; overflow-y:auto; }
#report-list::-webkit-scrollbar { width: 4px; }
#report-list::-webkit-scrollbar-track { background: transparent; }
#report-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.school-card {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .12s;
  display: flex; align-items: flex-start; gap: 10px;
}
.school-card:hover { background: var(--panel2); }
.school-card.active { background: #1e3a5f; }

.risk-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0; margin-top: 5px;
}
.risk-dot.red    { background: var(--red); box-shadow: 0 0 6px var(--red); }
.risk-dot.yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }

.card-body { flex: 1; min-width: 0; }
.card-name { font-size: 13px; font-weight: 600; color: #e2e8f0; margin-bottom: 3px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-name.red    { color: var(--red); }
.card-name.yellow { color: var(--yellow); }
.card-meta { font-size: 11px; color: var(--muted); line-height: 1.5; }
.card-dist { font-size: 12px; font-weight: 700; flex-shrink: 0; padding-top: 1px; }
.card-dist.red    { color: var(--red); }
.card-dist.yellow { color: var(--yellow); }

/* 빈 상태 */
#empty-state {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--muted); gap: 8px;
}
#empty-state .e-icon { font-size: 36px; opacity: .4; }
#empty-state .e-msg  { font-size: 13px; }

/* ── 지도 영역 ── */
#map-wrap {
  flex: 1; position: relative;
  background: #0d1117;
}
#map { width: 100%; height: 100%; }

/* 지도 위 범례 */
#legend {
  position: absolute; bottom: 28px; right: 16px;
  background: rgba(22, 27, 39, .95);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 16px; font-size: 12px; z-index: 10;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 24px rgba(0,0,0,.5);
}
.leg-title { font-size: 10px; font-weight: 700; color: var(--muted);
             text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; }
.leg-row   { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             color: var(--text); }
.leg-dot   { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.leg-star  { font-size: 14px; line-height: 1; }
.leg-ring  { width:12px; height:12px; border-radius:50%; flex-shrink:0; }

/* 분석 중 오버레이 */
#loading {
  display: none;
  position: absolute; inset: 0;
  background: rgba(13,17,23,.7);
  backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
  z-index: 50; font-size: 15px; color: var(--text);
}
#loading.show { display: flex; }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 토스트 */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #1e293b; border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 20px;
  font-size: 13px; color: var(--text);
  transition: transform .3s ease; z-index: 9999;
  box-shadow: 0 4px 20px rgba(0,0,0,.5);
  max-width: 360px; text-align: center; line-height: 1.5;
}
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.err  { border-color: var(--red); color: var(--red); }
#toast.ok   { border-color: var(--success); color: var(--success); }
#toast.info { border-color: #7dd3fc; color: #7dd3fc; }

/* ── 확인 모달 ── */
#modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.6); z-index: 500;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
#modal-overlay.show { display: flex; }
#modal-box {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 14px; padding: 28px 32px; max-width: 340px;
  width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,.6);
  text-align: center;
}
#modal-box .m-icon  { font-size: 32px; margin-bottom: 12px; }
#modal-box .m-title { font-size: 16px; font-weight: 700; color: #e2e8f0; margin-bottom: 8px; }
#modal-box .m-desc  { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
.m-btns { display: flex; gap: 10px; justify-content: center; }
.m-btn {
  border: none; border-radius: 8px; padding: 9px 22px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: inherit; transition: opacity .15s;
}
.m-btn:hover { opacity: .85; }
.m-btn.cancel { background: var(--panel2); color: var(--muted); border: 1px solid var(--border); }
.m-btn.danger { background: #7f1d1d; color: #fca5a5; }
</style>
</head>
<body>

<!-- ── 헤더 ── -->
<div id="header">
  <div class="logo">🛡️<span>교육환경사전검토</span> v1.0</div>
  <div class="hdr-sep"></div>

  <!-- REST 키 입력란은 UI 유지를 위해 남겨두었으나, 지도/검색 로직에는 더이상 쓰이지 않습니다. -->
  <div class="key-group" style="display:none;">
    <label>🔑 REST 키</label>
    <input type="password" id="rest-key-input" placeholder="REST API 키" autocomplete="off" style="width:160px">
    <button class="eye-btn" onclick="toggleKey('rest-key-input','_restVis')">👁</button>
  </div>
  
  <div class="key-group">
    <label>🗺️ 카카오 JS 키</label>
    <input type="password" id="js-key-input" placeholder="JavaScript 키" autocomplete="off" style="width:200px">
    <button class="eye-btn" onclick="toggleKey('js-key-input','_jsVis')">👁</button>
  </div>
  <button id="key-save-btn" onclick="saveKey()">저장</button>
  <span id="key-status" class="err">⚠ 키 미등록</span>

  <div class="hdr-spacer"></div>
  <a class="hdr-link" href="https://developers.kakao.com" target="_blank">키 발급 →</a>
</div>

<!-- ── 메인 ── -->
<div id="main">

  <!-- 좌측 패널 -->
  <div id="left">

    <!-- 주소 입력 -->
    <div id="addr-section">
      <div class="section-label">📍 사업지 주소</div>
      <div class="addr-row">
        <input id="addr-input" type="text" value="경기 수원시 영통구 영통로 232"
               placeholder="도로명 또는 지번 주소 입력"
               onkeydown="if(event.key==='Enter') analyze()">
        <button id="analyze-btn" onclick="analyze()">🔍 분석</button>
      </div>
    </div>

    <!-- DB 업로드 + 초기화 -->
    <div id="db-section">
      <button id="db-upload-btn" class="db-btn"
              onclick="document.getElementById('file-input').click()">
        📂 DB 추가
      </button>
      <button id="db-clear-btn" class="db-btn" onclick="confirmClearDB()">
        🗑 DB 초기화
      </button>
      <input id="file-input" type="file" multiple accept=".json,.csv,.xlsx"
             onchange="loadFiles(this.files)">
      <span id="db-status-text">DB 미로드 — JSON / CSV / XLSX 지원</span>
    </div>

    <!-- 저장 상태 표시줄 -->
    <div id="save-bar">
      <div class="save-dot none" id="save-dot"></div>
      <span id="save-label">저장 정보 없음</span>
    </div>

    <!-- 데이터 출처 안내 -->
    <div id="guide-section">
  <div style="margin-bottom: 8px;">
    <span>① 학교:</span>
    <a href="https://www.schoolinfo.go.kr/ng/go/pnnggo_a01_l2.do" target="_blank">학교알리미(학교기본정보의 "JSON")</a>
  </div>
  <div>
    <span>② 유치원:</span>
    <a href="https://e-childschoolinfo.moe.go.kr/openData.do" target="_blank">유치원알리미(일반현황의 "CSV")</a>
  </div>
</div>

    <!-- 리포트 헤더 -->
    <div id="report-header">
      <span class="r-title">분석 결과</span>
      <span class="badge badge-red"   id="badge-red">🔴 —</span>
      <span class="badge badge-yellow" id="badge-yellow">🟡 —</span>
    </div>

    <!-- 학교 목록 / 빈 상태 -->
    <div id="report-list">
      <div id="empty-state">
        <div class="e-icon">🗺️</div>
        <div class="e-msg">주소를 입력하고 분석을 시작하세요</div>
      </div>
    </div>
  </div>

  <!-- 지도 -->
  <div id="map-wrap">
    <div id="map"></div>
    <div id="loading"><div class="spinner"></div><span>분석 중…</span></div>

    <!-- 범례 -->
    <div id="legend">
      <div class="leg-title">범례</div>
      <div class="leg-row"><span class="leg-star">⭐</span> 사업지</div>
      <div class="leg-row">
        <div class="leg-ring" style="border:2px solid rgba(239,68,68,.8);background:rgba(239,68,68,.1)"></div>
        200m — 법적 심의
      </div>
      <div class="leg-row">
        <div class="leg-ring" style="border:2px dashed rgba(59,130,246,.7);background:rgba(59,130,246,.05)"></div>
        500m — 영향권
      </div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--red)"></div> 법적심의 대상</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--yellow)"></div> 영향권 내 학교</div>
    </div>
  </div>
</div>

<!-- ── DB 초기화 확인 모달 ── -->
<div id="modal-overlay">
  <div id="modal-box">
    <div class="m-icon">⚠️</div>
    <div class="m-title">DB 초기화</div>
    <div class="m-desc">
      저장된 DB <strong id="modal-count">0</strong>건을 모두 삭제합니다.<br>
      삭제 후 복구할 수 없습니다.
    </div>
    <div class="m-btns">
      <button class="m-btn cancel" onclick="closeModal()">취소</button>
      <button class="m-btn danger" onclick="executeClearDB()">삭제</button>
    </div>
  </div>
</div>

<div id="toast"></div>
